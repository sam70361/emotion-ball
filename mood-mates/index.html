<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mood Mates 角色馆 · 两个原创卡通角色 × 32 种状态表情(SVG 实时驱动 / AI emotionId 对接 / 双语双主题)">
  <title>Mood Mates 角色馆</title>
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site/style.css">
</head>
<body class="mode-wall">

  <!-- 悬浮胶囊导航:品牌 LOGO 角色 / 语言 / 主题 -->
  <header class="topbar">
    <div class="brand">
      <span id="brandBall" class="brand-ball" aria-hidden="true"></span>
      <span class="brand-name" data-i18n="brandName">Mood Mates</span>
    </div>
    <div class="top-actions">
      <button type="button" id="langToggle" class="icon-btn lang-btn">EN</button>
      <button type="button" id="themeToggle" class="icon-btn" aria-label="Theme">
        <svg class="ico-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        <svg class="ico-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="page">

    <!-- 开屏:大字标题 + 底边半遮罩线稿角色 -->
    <section class="hero" id="hero">
      <div class="hero-backdrop" aria-hidden="true"></div>
      <div class="hero-copy">
        <p class="hero-eyebrow" data-i18n="heroEyebrow">MOOD MATES</p>
        <h1 class="hero-title" data-i18n="heroTitle">一整队会表达情绪的原创伙伴</h1>
        <p class="hero-sub" data-i18n="heroSub">2 个原创角色 × 32 种状态表情 · SVG 实时驱动 · 一个 emotionId 即可接入 AI</p>
        <button type="button" id="heroCta" class="hero-cta"><span data-i18n="heroCta">进入角色馆</span><span class="cta-arrow" aria-hidden="true">↓</span></button>
      </div>
      <p class="hero-hint" data-i18n="heroHint">移动鼠标它会注视你 · 点击它看它的招牌动作</p>
      <div class="hero-bot-clip" aria-hidden="true">
        <div id="heroBot" class="hero-bot"></div>
      </div>
    </section>

    <!-- 角色馆主区:角色选段 + 陈列墙 / 画册双模式 -->
    <section class="gallery" id="gallery">
      <!-- 角色选段:置于筛选 tab 上方,点击切换整馆 -->
      <div id="castRow" class="cast-row" aria-label="Characters"></div>

      <div class="gallery-head">
        <nav class="mode-switch" aria-label="View mode">
          <button type="button" id="modeWall" class="mode-btn active" data-i18n="navWall">陈列墙</button>
          <button type="button" id="modeAlbum" class="mode-btn" data-i18n="navAlbum">画册</button>
        </nav>
        <nav id="tabs" class="tabs"></nav>
        <p id="galleryHint" class="gallery-hint" data-i18n="galleryHint">点击角色卡切换角色 · 点击缩略图切换表情 · ← / → 键翻页</p>
        <button type="button" id="settingsToggle" class="icon-btn settings-btn" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
        </button>
      </div>

      <div class="thumb-zone" id="thumbZone">
        <div id="thumbFlow" class="thumb-flow"></div>
      </div>

      <div class="stage-zone">
        <button type="button" id="navPrev" class="pager-btn" aria-label="Previous">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>

        <div class="stage-block">
          <button type="button" id="stageClose" class="icon-btn stage-close" aria-label="Close">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
          <div id="tips" class="tips" role="status"></div>
          <div id="stage" class="stage"></div>
          <div class="emo-meta">
            <span id="emoId" class="emo-id">ID --</span>
            <span id="emoName" class="emo-name">--</span>
            <span id="pager" class="pager-ind">-- / --</span>
          </div>
          <p id="emoDesc" class="emo-desc"></p>
        </div>

        <button type="button" id="navNext" class="pager-btn" aria-label="Next">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
    </section>

  </main>

  <!-- 页脚:原创声明 + 授权入口 -->
  <footer class="site-foot">
    <p data-i18n="footNote">Mood Mates 全部角色均为原创设计。个人学习免费使用;商业使用请查看仓库内 LICENSE-COMMERCIAL.md 获取授权。</p>
  </footer>

  <!-- 设置抽屉 -->
  <div id="drawerMask" class="drawer-mask" hidden></div>
  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2 data-i18n="drawerTitle">设置</h2>
      <button type="button" id="drawerClose" class="icon-btn" aria-label="Close">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <section class="drawer-sec">
      <h3 data-i18n="secAppearance">外观</h3>
      <div class="field">
        <label for="charSelect" data-i18n="lblCharacter">当前角色</label>
        <select id="charSelect" class="select"></select>
      </div>
      <div class="field" id="variantField" style="display:none">
        <label for="variantSelect" data-i18n="lblVariant">身体轮廓</label>
        <select id="variantSelect" class="select"></select>
      </div>
      <div class="field">
        <label for="sketchToggle" data-i18n="lblSketch">线稿模式</label>
        <label class="switch">
          <input type="checkbox" id="sketchToggle">
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <section class="drawer-sec">
      <h3 data-i18n="secDemo">演示</h3>
      <div class="field">
        <label for="tourToggle" data-i18n="lblTour">自动巡演</label>
        <label class="switch">
          <input type="checkbox" id="tourToggle">
          <span class="slider"></span>
        </label>
      </div>
      <div class="field">
        <label for="tourInterval" data-i18n="lblInterval">巡演间隔</label>
        <select id="tourInterval" class="select">
          <option value="1500">1.5s</option>
          <option value="2500" selected>2.5s</option>
          <option value="4000">4s</option>
        </select>
      </div>
    </section>

    <section class="drawer-sec">
      <h3 data-i18n="secAI">AI 对接模拟</h3>
      <input id="aiInput" class="ai-input" type="text" spellcheck="false"
             value='{"emotionId":"30","tips":"正在思考用户问题"}'>
      <div class="btn-row">
        <button type="button" id="aiSend" class="btn primary" data-i18n="btnSend">下发</button>
        <button type="button" id="aiSampleErr" class="btn ghost" data-i18n="btnSampleErr">示例:出错</button>
        <button type="button" id="aiSampleBad" class="btn ghost" data-i18n="btnSampleBad">示例:未知 ID</button>
      </div>
    </section>

    <section class="drawer-sec">
      <h3 data-i18n="secConfig">配置</h3>
      <div class="btn-row">
        <button type="button" id="btnExport" class="btn" data-i18n="btnExport">导出配置</button>
        <button type="button" id="btnImport" class="btn" data-i18n="btnImport">导入配置</button>
      </div>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </section>
  </aside>

  <!-- 浮动状态提示 -->
  <div id="toast" class="toast" role="status"></div>

  <!-- 加载顺序:几何库 → 渲染层 → 五官层 → 特效层 → 表情数据 → 驱动层 → 角色包 → 文案 → 交互层 -->
  <script src="src/core/geometry.js"></script>
  <script src="src/core/render.js"></script>
  <script src="src/core/features.js"></script>
  <script src="src/core/fx.js"></script>
  <script src="src/data/emotions.js"></script>
  <script src="src/core/engine.js"></script>
  <script src="src/characters/nimbo.js"></script>
  <script src="src/characters/twinkle.js"></script>
  <script src="site/i18n.js"></script>
  <script src="site/app.js"></script>
</body>
</html>
